<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prize Carousel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .full-page {
      width: 100vw;
      height: 100vh;
      background:
        url("b2.jpg") top center / 100% 50% no-repeat,
        url("b1.jpg") bottom center / 100% 50% no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .glow-effect {
      animation: glow 1.2s ease-in-out infinite alternate,
                 float 1.2s ease-in-out infinite;
    }

    @keyframes glow {
      0% {
        filter: drop-shadow(0 0 6px #3b82f6)
                drop-shadow(0 0 12px #60a5fa)
                drop-shadow(0 0 18px #93c5fd);
      }
      100% {
        filter: drop-shadow(0 0 10px #3b82f6)
                drop-shadow(0 0 20px #60a5fa)
                drop-shadow(0 0 30px #93c5fd);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(3600deg); }
    }

    .spin-animation {
      animation: spin 5.5s cubic-bezier(0.33, 1, 0.68, 1) forwards;
    }
  </style>
</head>
<body class="m-0 p-0 overflow-hidden">
  <div class="full-page">

    <!-- Start Button -->
    <div id="initialButtonContainer" class="absolute bottom-10 left-1/2 -translate-x-1/2 z-20">
      <button id="startButton" class="focus:outline-none">
        <img src="bt1.jpg" alt="Start Button" class="w-[220px] h-auto object-contain select-none glow-effect" />
      </button>
    </div>

    <!-- Spinner -->
    <div id="wheelContainer" class="absolute bottom-10 left-1/2 -translate-x-1/2 z-20 hidden">
      <button id="wheelButton" class="relative">
        <img id="wheelImage" src="spiner1.png" class="w-[400px] h-[400px] object-contain select-none" />
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-white text-6xl pointer-events-none"></div>
      </button>
    </div>

    <!-- Carousel Viewer -->
    <div id="carouselContainer" class="fixed inset-0 flex items-center justify-center z-30 hidden bg-transparent">
      <div class="max-w-screen-lg w-full bg-transparent p-6 flex flex-col items-center">
        <img
          id="carouselImage"
          src=""
          alt="Carousel Image"
          class="w-full max-h-[85vh] object-contain rounded-lg shadow-lg"
        />

        <!-- Dots Indicator -->
        <div id="carouselDots" class="flex justify-center mt-4 gap-2"></div>

        <!-- Controls -->
        <div class="mt-4 flex gap-4">
          <button id="prevBtn" class="px-4 py-2 bg-yellow-300 rounded border border-black">‹</button>
          <button id="nextBtn" class="px-4 py-2 bg-yellow-300 rounded border border-black">›</button>
          <button id="closeCarousel" class="px-4 py-2 bg-blue-500 text-white rounded">Close</button>
        </div>
      </div>
    </div>

  </div>

  <!-- JavaScript -->
  <script>
    const startButton = document.getElementById("startButton");
    const initialButtonContainer = document.getElementById("initialButtonContainer");
    const wheelContainer = document.getElementById("wheelContainer");
    const wheelButton = document.getElementById("wheelButton");
    const wheelImage = document.getElementById("wheelImage");
    const carouselContainer = document.getElementById("carouselContainer");
    const carouselImage = document.getElementById("carouselImage");
    const carouselDots = document.getElementById("carouselDots");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const closeCarousel = document.getElementById("closeCarousel");

    const carouselItems = ["w1.jpg", "w2.jpg", "w3.jpg", "w4.jpg"];
    let currentIndex = 0;
    let hasSpun = false;

    function updateCarousel(index) {
      carouselImage.src = carouselItems[index];
      renderDots();
    }

    function renderDots() {
      carouselDots.innerHTML = "";
      carouselItems.forEach((_, index) => {
        const dot = document.createElement("span");
        dot.className = `w-3 h-3 rounded-full cursor-pointer ${
          index === currentIndex ? "bg-blue-500" : "bg-gray-300"
        }`;
        dot.addEventListener("click", () => {
          currentIndex = index;
          updateCarousel(currentIndex);
        });
        carouselDots.appendChild(dot);
      });
    }

    startButton.addEventListener("click", () => {
      initialButtonContainer.classList.add("hidden");

      if (hasSpun) {
        carouselContainer.classList.remove("hidden");
        updateCarousel(currentIndex);
      } else {
        wheelContainer.classList.remove("hidden");
      }
    });

    wheelButton.addEventListener("click", () => {
      if (wheelImage.classList.contains("spin-animation")) return;
      wheelImage.classList.add("spin-animation");

      setTimeout(() => {
        wheelImage.classList.remove("spin-animation");
        wheelContainer.classList.add("hidden");
        carouselContainer.classList.remove("hidden");
        updateCarousel(currentIndex);
        hasSpun = true;
      }, 5500);
    });

    prevBtn.addEventListener("click", () => {
      currentIndex = (currentIndex - 1 + carouselItems.length) % carouselItems.length;
      updateCarousel(currentIndex);
    });

    nextBtn.addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % carouselItems.length;
      updateCarousel(currentIndex);
    });

    closeCarousel.addEventListener("click", () => {
      carouselContainer.classList.add("hidden");
      initialButtonContainer.classList.remove("hidden");
    });
  </script>
</body>
</html>
